name: Migration checksums

on:
  push:
    branches: ["master"]

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print migration checksums
        run: |
          sha256sum prisma/migrations/20260908175100_init_market_lint/migration.sql
          sha256sum prisma/migrations/20260908180500_p0_durability/migration.sql
