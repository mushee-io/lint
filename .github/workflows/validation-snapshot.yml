name: Market Lint Validation Snapshot

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/validation-snapshot.yml"
      - "src/app/api/internal/validation/**"
      - "src/lib/validation.ts"
      - "src/lib/scheduler-auth.ts"

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_LINT_BASE_URL: https://lint-chi.vercel.app
    steps:
      - name: Capture validation snapshot
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=market-lint-scheduler")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')

          STATUS=000
          for ATTEMPT in $(seq 1 10); do
            STATUS=$(curl --silent --show-error \
              --max-time 30 \
              --output validation.json \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${OIDC_TOKEN}" \
              "${MARKET_LINT_BASE_URL}/api/internal/validation" || true)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            echo "Validation endpoint returned HTTP ${STATUS}; retrying (${ATTEMPT}/10)..."
            cat validation.json 2>/dev/null || true
            sleep 15
          done

          if [ "$STATUS" != "200" ]; then
            echo "Validation snapshot failed after retries"
            exit 1
          fi

          cat validation.json | jq .
          echo '### Market Lint 24-72h validation snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '{generatedAt: .data.generatedAt, validation: .data.validation, scheduler: .data.scheduler, sources: .data.sources, data: .data.data, workers: .data.workers, webhooks: .data.webhooks}' validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-lint-validation-${{ github.run_id }}
          path: validation.json
          retention-days: 7
